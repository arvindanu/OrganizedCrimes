<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Termorgan — Showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Silkscreen&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--g:linear-gradient(100deg,#8a6a1f,#d4af37 30%,#fff1b8 50%,#d4af37 70%,#8a6a1f);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:#000;overflow:hidden;color:#eee}
#c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);cursor:pointer;background:#000}
#ui{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:10px;align-items:center;justify-content:center;font:13px system-ui,sans-serif}
#ui button{background:#000;color:#eee;border:1px solid #d4af37;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
#ui button:focus-visible{outline:2px solid #fff1b8;outline-offset:2px}
#bg{width:min(240px,28vw);height:2px;background:#222}#pg{height:100%;width:0;background:var(--g)}
#tm{color:#888;min-width:3.6em;font-variant-numeric:tabular-nums}
/* embed mode: video fills the whole frame, controls float over it and appear on hover */
#ui{opacity:0;transition:opacity .4s ease}body:hover #ui,#ui:focus-within{opacity:1}
@media(hover:none),(prefers-reduced-motion:reduce){#ui{opacity:1}}
@media(max-width:480px){#ui{gap:6px;font-size:11px}#ui button{padding:5px 10px}#bg{width:44px}#tm{min-width:3em}}
</style></head><body>
